<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <nav class="nav">
    <div class="wrap nav-inner">
      <span class="nav-name" id="nav-name">Your Name</span>
      <div class="nav-links">
        <a href="#work">Work</a>
        <a href="#contact">Contact</a>
      </div>
    </div>
  </nav>

  <header class="hero">
    <div class="wrap">
      <p class="eyebrow" id="role">Your Role</p>
      <h1 class="name" id="name">Your Name</h1>
      <p class="bio" id="bio">Bio goes here.</p>
      <div class="hero-actions">
        <a class="btn btn-primary" id="email-link" href="#">Get in touch</a>
        <div class="hero-socials" id="socials"></div>
      </div>
      <p class="location" id="location">Location</p>
    </div>
  </header>

  <main class="wrap" id="work">
    <div class="section-head">
      <h2>Selected work</h2>
      <span class="count"><span id="project-count">00</span> projects</span>
    </div>
    <div id="project-list" class="project-grid"></div>
  </main>

  <footer class="wrap" id="contact">
    <div class="footer-inner">
      <span>© <span id="year"></span> <span id="footer-name"></span></span>
      <span class="footer-note">Built and deployed with GitHub Pages</span>
    </div>
  </footer>

  <script src="content.js"></script>
  <script src="app.js"></script>
</body>
</html>
